name: Magnus YouTube AI Machine

on:
  workflow_dispatch: # ONLY manual — click "Run workflow" to start

permissions:
  contents: write

jobs:
  build_videos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Piper TTS + System Tools
      run: |
        sudo apt-get install -y wget
        mkdir -p piper_voices
        cd piper_voices
        wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx
        wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx.json
        cd ..

    - name: Install Python Dependencies
      run: pip install -r requirements.txt

    - name: Run Magnus Machine
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: python main.py

    - name: Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: Magnus-Output-${{ github.run_number }}
        path: output/

    - name: Commit Used Topics
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Magnus Bot"
        git add used_topics.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update used topics [skip ci]"
        git push
