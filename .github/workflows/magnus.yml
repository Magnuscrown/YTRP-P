name: Magnus Finance Machine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Piper voice (en_US-hfc_male-medium)
        run: |
          mkdir -p models
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/hfc_male/medium
          curl -L -o models/en_US-hfc_male-medium.onnx $BASE/en_US-hfc_male-medium.onnx
          curl -L -o models/en_US-hfc_male-medium.onnx.json $BASE/en_US-hfc_male-medium.onnx.json

      - name: Run Magnus
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Magnus-Finance-Output-${{ github.run_number }}
          path: output/

      - name: Commit used topics
        if: always()
        run: |
          git config user.name "magnus-bot"
          git config user.email "magnus-bot@users.noreply.github.com"
          git add used_topics.json
          git diff --cached --quiet || (git commit -m "Update used topics" && git push)
