name: Test action pictures (Level 2)

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene to draw"
        default: "clean 3D cartoon young man at a kitchen table counting coins, bright colours"
      action:
        description: "Small change to make"
        default: "eyes closed in a blink"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      SCENE: ${{ inputs.scene }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Make a picture, then edit it
        run: python test_edit.py "$SCENE" "$ACTION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-pictures
          path: out/test_*.png
          retention-days: 3
