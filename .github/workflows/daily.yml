name: Make series

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Story theme"
        default: "a quiet new student is secretly the owner of the school"
      parts:
        description: "Number of parts"
        default: "10"
      action_bursts:
        description: "Action beats per part (flipbook moments)"
        default: "4"
      burst_frames:
        description: "Quick pictures in each action beat"
        default: "4"
      cut_seconds:
        description: "Longest time before a cut (smaller = faster)"
        default: "2"
  # Turn this on AFTER the first manual run works (remove the # signs):
  # schedule:
  #   - cron: "0 20 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      THEME: ${{ inputs.theme }}
      PARTS: ${{ inputs.parts }}
      BURSTS: ${{ inputs.action_bursts }}
      BURST_FRAMES: ${{ inputs.burst_frames }}
      SHOT_SECS: ${{ inputs.cut_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts
      - name: Write the story series
        run: python series_writer.py "$THEME" "$PARTS"
      - name: Make all videos and the long video
        run: python make_all.py
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            out/*.mp4
            out/series.json
          retention-days: 7
