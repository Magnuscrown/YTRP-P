name: Movie recap

on:
  workflow_dispatch:
    inputs:
      archive_id:
        description: "Internet Archive item id (the last part of archive.org/details/ID)"
        required: true
      confirm_public_domain:
        description: "Type yes ONLY if YOU verified this film is public domain / free to reuse"
        default: "no"
      minutes:
        description: "Target video length in minutes"
        default: "20"
      synopsis:
        description: "Optional: paste a short plot synopsis (helps a lot, needed for silent films)"
        default: ""
      short_seconds:
        description: "Length of each vertical Short in seconds (max about 170)"
        default: "150"

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ARCHIVE_ID: ${{ inputs.archive_id }}
      MINUTES: ${{ inputs.minutes }}
      SYNOPSIS: ${{ inputs.synopsis }}
      CONFIRM_PD: ${{ inputs.confirm_public_domain }}
      SHORT_SECONDS: ${{ inputs.short_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests edge-tts faster-whisper
      - name: Make the recap
        run: |
          printf '%s' "$SYNOPSIS" > synopsis.txt
          FLAG=""
          if [ "$CONFIRM_PD" = "yes" ]; then FLAG="--confirm-public-domain"; fi
          python recap.py --id "$ARCHIVE_ID" --minutes "$MINUTES" --synopsis synopsis.txt $FLAG
      - name: Make the vertical Shorts
        run: python shorts.py --seconds "$SHORT_SECONDS"
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: recap
          path: |
            out/recap.mp4
            out/description.txt
            out/titles.txt
            out/source.json
            out/recap_script.json
            out/shorts/part_*.mp4
          retention-days: 7
